<app-menu-header/>

<main class="panel">
  <h1>Importar arxiu</h1>

  <label class="dropzone" for="arxiu">
    <svg class="dropzone__icono" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"
            fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="dropzone__titulo">Deixa aqui el teu arxiu CSV</span>
    <span class="dropzone__ayuda">o fes clic aqui per a seleccionar-lo</span>
    <input id="arxiu" type="file" accept=".csv,text/csv">
  </label>

  <div class="acciones">
    <button type="button" class="btn">Cancelar</button>
    <button type="button" class="btn">Importar</button>
  </div>
</main>
