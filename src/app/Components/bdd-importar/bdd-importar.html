
<app-menu-header />

<main class="panel">
  <h1>Importar arxiu</h1>

  <label
    class="dropzone"
    for="arxiu"
    (dragover)="$event.preventDefault()"
    (drop)="onDrop($event)"
  >
    <svg class="dropzone__icono"
         viewBox="0 0 24 24"
         aria-hidden="true">
      <path
        d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    <span class="dropzone__titulo">Deixa aquí el teu arxiu Excel</span>

    <span class="dropzone__ayuda">
      o fes clic aquí per seleccionar-lo
    </span>

    <input
      id="arxiu"
      type="file"
      accept=".xlsx,.xls"
      (change)="onFileSelected($event)"
    />
  </label>

  <p class="archivo" *ngIf="archivoSeleccionado">
    Arxiu seleccionat: {{ archivoSeleccionado.name }}
  </p>

  <p class="mensaje" *ngIf="mensaje">
    {{ mensaje }}
  </p>

  <div class="acciones">
    <button
      type="button"
      class="btn"
      routerLink="/bdd"
    >
      Cancel·lar
    </button>

    <button
      type="button"
      class="btn btn--importar"
      [disabled]="!archivoSeleccionado || cargando"
      (click)="enviarArchivo()"
    >
      {{ cargando ? 'Important...' : 'Importar' }}
    </button>
  </div>
</main>
