<main class="pantalla">
  <section class="tarjeta">
    <h1>Registre de lavabo</h1>
    <p class="subtitulo">Inicia sessió per anotar als alumnes.</p>

    <form>
      <div class="campo">
        <label for="usuario">Usuari</label>
        <input type="text" id="usuario" placeholder="El nom del teu usuari" required>
      </div>

      <div class="campo">
        <label for="password">Contrasenya</label>
        <input type="password" id="password" placeholder="La teva contrasenya" required>
      </div>

      <button type="submit" class="boton">Iniciar sessió</button>
    </form>
  </section>
</main>
