<app-menu-header/>

<div class="pagina">
  <main class="contenedor">

    <section class="panel">
      <div class="campos">
        <h2 class="titulo">Buscar entre dues dates</h2>

        <!-- Data inicial -->
        <div class="fila">
          <input type="text" class="campo campo-grande" placeholder="Dia" aria-label="Dia inicial" inputmode="numeric" maxlength="2">
          <input type="text" class="campo campo-grande" placeholder="Mes" aria-label="Mes inicial" inputmode="numeric" maxlength="2">
          <input type="text" class="campo campo-grande" placeholder="Any" aria-label="Any inicial" inputmode="numeric" maxlength="4">
        </div>

        <span class="separador">-</span>

        <!-- Data final -->
        <div class="fila">
          <input type="text" class="campo campo-grande" placeholder="Dia" aria-label="Dia final" inputmode="numeric" maxlength="2">
          <input type="text" class="campo campo-grande" placeholder="Mes" aria-label="Mes final" inputmode="numeric" maxlength="2">
          <input type="text" class="campo campo-grande" placeholder="Any" aria-label="Any final" inputmode="numeric" maxlength="4">
        </div>
      </div>

      <button type="button" class="boton">Buscar</button>
    </section>

  </main>
</div>
