<main class="pantalla">
  <section class="lista">
    <h1>Alumnes en el lavabo</h1>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <table>
      <thead>
      <tr>
        <th>Alumne</th>
        <th>Hora de entrada</th>
        <th>Temps fora</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
        @for (e of alLavabo(); track e.alumne.idAlumne) {
          <tr>
            <td>
              <button type="button" class="nom-alumne" (click)="sortir(e)" title="Clic quan torni del lavabo">
                {{ e.alumne.nom }} {{ e.alumne.cognom1 }} {{ e.alumne.cognom2 }}
              </button>
            </td>
            <td>{{ e.dataEntrada | date:'HH:mm' }}</td>
            <td>{{ minutsFora(e) }} min</td>
            <td>
              <span class="punto" [class.conflictivo]="e.alumne.conflictiu" [class.normal]="!e.alumne.conflictiu"></span>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="4">No hi ha cap alumne al lavabo</td></tr>
        }
      </tbody>
    </table>
  </section>
</main>
