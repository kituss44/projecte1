<app-menu-header/>

<div class="reg_entrada_div">
  <main class="pantalla">
    <section class="panel">

      <div class="campos">
        <input type="text" class="campo" placeholder="Id alumne (Numero)" aria-label="Id alumne"
               [value]="idAlumne()" (input)="canviId($any($event.target).value)"
               (keyup.enter)="!alumneTrobat() && buscar()">
        <input type="text" class="campo" placeholder="Professor que l'ha deixat sortir" aria-label="Professor"
               [value]="professor()" (input)="professor.set($any($event.target).value)">
      </div>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <div class="acciones">
        @if (alumneTrobat()) {
          <button type="button" class="boton" (click)="registrar()">Registrar</button>
        } @else {
          <button type="button" class="boton" (click)="buscar()">Buscar alumne</button>
        }
        <button type="button" class="boton" routerLink="/inserirManualment">Buscar manualment</button>
      </div>

    </section>
  </main>
</div>

<app-foto-alumne [alumne]="alumneTrobat()"/>
<app-llistat-alumnes-lavabo/>
